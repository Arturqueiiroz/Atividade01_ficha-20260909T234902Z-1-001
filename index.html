<!doctype html>

<!-- Define que o documento usa HTML5 -->
<html lang="pt-BR">
	<head>
		<!-- Define o padrão de caracteres -->
		<meta charset="UTF-8" />

		<!-- Faz o site funcionar melhor em celulares -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- Título exibido na aba do navegador -->
		<title>Ficha de Personagem</title>

		<!-- Conecta o HTML com o arquivo CSS -->
		<link rel="stylesheet" href="./style.css" />
	</head>

	<body>
		<!-- Container principal da ficha -->
		<main class="ficha-container">
			<!-- Cabeçalho da ficha -->
			<header class="ficha-header">
				<!-- Imagem da personagem -->
				<img
					src="./hb20.webp"
					alt="Carro Hb20"
					class="personagem-foto" />

				<!-- Nome da personagem -->
				<h1 class="personagem-nome">Ficha do Carro</h1>

				<!-- Título ou profissão -->
				<h2 class="personagem-titulo">Hyudai HB20</h2>
			</header>

			<!-- Biografia -->
			<section class="ficha-bio">
				<h3>Tecnologia e Conforto</h3>

				<p>
					O Hyudai HB20 é um carro bom para quem quer um veículo confiável e gostoso de dirigir.
				</p>
			</section>

			<!-- Lista de habilidades -->
			<section class="ficha-habilidades">
				<h3>Especificações</h3>

				<ul>
					<li>Motor: Turbo</li>

					<li>Câmbio: Automático</li>

					<li>Categoria: Hatch</li>

					<li>Combustível: Flex</li>

					<li>Cor: Cinza Shadow</li>
				</ul>
			</section>
		</main>
	</body>
</html>
